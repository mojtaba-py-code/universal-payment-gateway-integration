# Reverse proxy for the UPGI API.
# Terminates client connections, applies basic hardening and rate limiting,
# and forwards to the upstream ASGI server.

upstream upgi_api {
    server api:8000;
}

# A coarse network-level rate limit complementing the app-level limiter.
limit_req_zone $binary_remote_addr zone=upgi_rl:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Do not leak the proxy/server version.
    server_tokens off;

    # Reasonable body size for API payloads.
    client_max_body_size 1m;

    # Security headers (defence in depth; the app sets these too).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        limit_req zone=upgi_rl burst=40 nodelay;

        proxy_pass http://upgi_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Keep infra probes cheap and unthrottled.
    location = /health/live {
        proxy_pass http://upgi_api;
        access_log off;
    }
}
