# Minimal Prometheus scrape config for UPGI.
# Point Prometheus at the API's /metrics endpoint. Extend with your own
# service discovery in production.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: upgi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: upgi
